        ant.replaceregexp(file:"$xsdOutput/cnpTransaction_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"7\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"SEVEN\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
        ant.replaceregexp(file:"$xsdOutput/cnpTransaction_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"8\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"EIGHT\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
        ant.replaceregexp(file:"$xsdOutput/cnpTransaction_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"9\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"NINE\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
        ant.replaceregexp(file:"$xsdOutput/cnpCommon_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"\\+\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"PLUS\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
        ant.replaceregexp(file:"$xsdOutput/cnpCommon_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"0\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"ZERO\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
        ant.replaceregexp(file:"$xsdOutput/cnpCommon_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"1\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"ONE\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
