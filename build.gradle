        ant.replaceregexp(file:"$xsdOutput/cnpTransaction_v${SCHEMA_VERSION}.xsd", match:"(simpleType name=\"tlidValidationActionIndicatorType\">)", replace:"\\1<xs:annotation><xs:appinfo><jaxb:typesafeEnumClass name=\"TlidValidationActionIndicatorType\"/></xs:appinfo></xs:annotation>", flags:"s")
        ant.replaceregexp(file:"$xsdOutput/cnpTransaction_v${SCHEMA_VERSION}.xsd", match:"(<xs:enumeration value=\"1\")\\s?+/>", replace:"\\1><xs:annotation><xs:appinfo><jaxb:typesafeEnumMember name=\"ONE\"/></xs:appinfo></xs:annotation></xs:enumeration>", byline:true)
